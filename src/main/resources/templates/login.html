<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk atau Daftar - LokalShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; color: #0F172A; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center py-10 px-4">

    <div class="max-w-md w-full bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <!-- Header Brand -->
        <div class="px-6 pt-8 pb-6 text-center border-b border-slate-100">
            <div class="w-12 h-12 bg-emerald-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl mx-auto shadow-sm">
                L
            </div>
            <h1 class="text-2xl font-bold text-slate-900 mt-3">Lokal<span class="text-emerald-600">Shop</span></h1>
            <p class="text-xs text-slate-500 mt-1">Satu akun untuk menjual dan membeli di sekitar Bogor</p>
        </div>

        <!-- Notifikasi Error / Sukses -->
        <div th:if="${error}" class="mx-6 mt-5 p-3 rounded-xl bg-red-50 border border-red-200 text-xs text-red-700 font-medium" th:text="${error}">
            Pesan Error
        </div>
        <div th:if="${sukses}" class="mx-6 mt-5 p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-700 font-medium" th:text="${sukses}">
            Pesan Sukses
        </div>

        <!-- Tab Navigasi -->
        <div class="grid grid-cols-2 border-b border-slate-200 bg-slate-50/50 mt-4">
            <button type="button" onclick="tampilkanTab('login')" id="tab-login" 
                    class="py-3 text-sm font-bold text-emerald-600 border-b-2 border-emerald-600 bg-white">
                Masuk Akun
            </button>
            <button type="button" onclick="tampilkanTab('register')" id="tab-register" 
                    class="py-3 text-sm font-semibold text-slate-500 hover:text-slate-800">
                Daftar Baru
            </button>
        </div>

        <!-- FORM 1: LOGIN -->
        <form id="form-login" action="/login" method="post" class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Alamat Email</label>
                <input type="email" name="email" required placeholder="contoh: admin@email.com"
                       class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-sm transition text-sm">
                Masuk ke LokalShop
            </button>

    
        </form>

        <!-- FORM 2: REGISTER (Tersembunyi Awalnya) -->
        <form id="form-register" action="/register" method="post" class="p-6 space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Nama Lengkap</label>
                <input type="text" name="nama" required placeholder="Nama kamu"
                       class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Email</label>
                <input type="email" name="email" required placeholder="nama@email.com"
                       class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Nomor Telepon</label>
                    <input type="text" name="nomorTelepon" required placeholder="0812..."
                           class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
                    <input type="password" name="password" required placeholder="••••••••"
                           class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Titik Koordinat Lokasi (Nearby Discovery)</label>
                <input type="text" name="koordinatLokasi" value="-6.5971, 106.8060" required
                       class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl shadow-sm transition text-sm">
                Buat Akun & Masuk
            </button>
        </form>
    </div>

    <script>
        function tampilkanTab(tab) {
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (tab === 'login') {
                formLogin.classList.remove('hidden');
                formRegister.classList.add('hidden');
                tabLogin.className = 'py-3 text-sm font-bold text-emerald-600 border-b-2 border-emerald-600 bg-white';
                tabRegister.className = 'py-3 text-sm font-semibold text-slate-500 hover:text-slate-800';
            } else {
                formRegister.classList.remove('hidden');
                formLogin.classList.add('hidden');
                tabRegister.className = 'py-3 text-sm font-bold text-emerald-600 border-b-2 border-emerald-600 bg-white';
                tabLogin.className = 'py-3 text-sm font-semibold text-slate-500 hover:text-slate-800';
            }
        function ambilGps() {
            const input = document.getElementById('input-koordinat');
            const status = document.getElementById('status-gps');
            const btn = document.getElementById('btn-gps');

            if (!navigator.geolocation) {
                status.textContent = "Browser tidak mendukung GPS.";
                return;
            }

            btn.textContent = "Mencari...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude.toFixed(6);
                    const lon = pos.coords.longitude.toFixed(6);
                    input.value = `${lat}, ${lon}`;
                    status.textContent = "✔ Koordinat GPS asli berhasil didapatkan!";
                    status.className = "text-[11px] text-emerald-600 font-medium mt-1";
                    btn.textContent = "📍 Perbarui";
                },
                (err) => {
                    status.textContent = "⚠ Izin lokasi ditolak / gagal. Menggunakan titik default Bogor.";
                    status.className = "text-[11px] text-amber-600 mt-1";
                    btn.textContent = "📍 Coba Lagi";
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        }
    </script>
</body>
</html>
